name: Build APK & Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing platform folders (android/web)
        run: flutter create --platforms=android,web --org com.example .

      - name: Remove default generated widget test
        run: rm -f test/widget_test.dart

      - name: Ensure INTERNET permission in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        run: |
          URL=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\n\r')
          KEY=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '\n\r')
          flutter build apk --release --dart-define=SUPABASE_URL="$URL" --dart-define=SUPABASE_ANON_KEY="$KEY"

      - name: Build Web (release)
        run: |
          URL=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\n\r')
          KEY=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '\n\r')
          flutter build web --release --dart-define=SUPABASE_URL="$URL" --dart-define=SUPABASE_ANON_KEY="$KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-web-build
          path: build/web

      # --- Déploiement Web optionnel vers Firebase Hosting ---
      # Décommenter et configurer les secrets FIREBASE_TOKEN et
      # FIREBASE_PROJECT_ID (Repo Settings > Secrets and variables > Actions)
      # pour obtenir une vraie URL publique à chaque push.
      #
      # - name: Deploy to Firebase Hosting
      #   run: |
      #     npm install -g firebase-tools
      #     firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
